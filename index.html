<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Padel Trainer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
      }
      #start-prompt {
        position: fixed;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 14px 22px;
        border-radius: 10px;
        background: rgba(10, 16, 22, 0.78);
        color: #f2f5f7;
        font: 14px/1.4 system-ui, sans-serif;
        text-align: center;
        pointer-events: none;
      }
      #start-prompt[hidden] {
        display: none;
      }
      #start-prompt strong {
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
