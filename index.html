<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- iPhone : ajouté à l'écran d'accueil, le jeu s'ouvre sans la barre du navigateur. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Padel Smash" />
    <title>Padel Smash</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
        /* Les pouces posent les sticks tactiles : pas de défilement ni de zoom du navigateur. */
        touch-action: none;
      }
      /* Sticks tactiles (`src/input/virtualStick.ts`) : un anneau là où le pouce s'est posé. */
      .touch-stick {
        position: fixed;
        width: 120px;
        height: 120px;
        margin: -60px 0 0 -60px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.06);
        pointer-events: none;
      }
      .touch-stick[hidden] {
        display: none;
      }
      .touch-stick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        margin: -26px 0 0 -26px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.45);
      }
      #start-prompt {
        position: fixed;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 14px 22px;
        border-radius: 10px;
        background: rgba(10, 16, 22, 0.78);
        color: #f2f5f7;
        font: 14px/1.4 system-ui, sans-serif;
        text-align: center;
        pointer-events: none;
      }
      /* Panneau latéral (labo, machine à balles) : `src/ui/annexes.css`. */
      #pause {
        position: fixed;
        top: 30%;
        left: 50%;
        transform: translateX(-50%);
        color: #f2f5f7;
        font: 600 30px/1 system-ui, sans-serif;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }
      #pause.review {
        top: 8%;
        font-size: 16px;
      }
      #pause[hidden] {
        display: none;
      }
      #stats,
      #result,
      #contact {
        position: fixed;
        color: #f2f5f7;
        font: 15px/1.4 system-ui, sans-serif;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }
      #stats {
        top: 14px;
        left: 18px;
      }
      #result,
      #contact {
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
        font-weight: 600;
      }
      #result {
        top: 16%;
        font-size: 26px;
      }
      #result[data-kind='valid'] {
        color: #7be08a;
      }
      #result[data-kind='fault'] {
        color: #ff8a7a;
      }
      #result[data-kind='missed'] {
        color: #cfd6dc;
      }
      #contact {
        top: 58%;
        font-size: 17px;
      }
      #contact[data-kind='miss'] {
        color: #ffb38a;
      }
      #reach {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 14px;
        height: 14px;
        margin: -9px 0 0 -9px;
        border: 2px solid rgba(255, 255, 255, 0.45);
        border-radius: 50%;
        pointer-events: none;
        transition: transform 0.08s, border-color 0.08s;
      }
      #reach.on {
        border-color: #6dff8f;
        transform: scale(1.9);
      }
      #reach[hidden] {
        display: none;
      }
      #contact[data-kind='perfect'] {
        color: #ffd95a;
        font-size: 22px;
      }
      .flash {
        animation: flash 1.8s ease-out forwards;
      }
      #contact.flash {
        animation-duration: 0.9s;
      }
      @keyframes flash {
        0%,
        60% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      #start-prompt[hidden] {
        display: none;
      }
      #start-prompt strong {
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
