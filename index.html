<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Padel Smash</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
      }
      #start-prompt {
        position: fixed;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 14px 22px;
        border-radius: 10px;
        background: rgba(10, 16, 22, 0.78);
        color: #f2f5f7;
        font: 14px/1.4 system-ui, sans-serif;
        text-align: center;
        pointer-events: none;
      }
      #panel {
        position: fixed;
        top: 44px;
        left: 18px;
        width: 250px;
        max-height: calc(100vh - 60px);
        overflow-y: auto;
        box-sizing: border-box;
        padding: 14px 16px;
        border-radius: 10px;
        background: rgba(10, 16, 22, 0.82);
        color: #f2f5f7;
        font: 13px/1.4 system-ui, sans-serif;
      }
      #panel[hidden] {
        display: none;
      }
      #panel h2 {
        margin: 12px 0 6px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #9fb0bf;
      }
      #panel h2:first-child {
        margin-top: 0;
      }
      #panel .exercises,
      #panel .actions {
        display: grid;
        gap: 4px;
      }
      #panel .actions {
        margin-top: 12px;
      }
      #panel button {
        padding: 6px 10px;
        border: 1px solid #3a4a58;
        border-radius: 6px;
        background: #1c2833;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      #panel button:hover {
        background: #263645;
      }
      #panel button.selected {
        border-color: #6cb4e8;
        background: #1f4260;
      }
      #panel label {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 8px;
        margin-top: 10px;
      }
      #panel label input {
        grid-column: 1 / -1;
        width: 100%;
        margin: 0;
      }
      #panel label .value {
        grid-row: 1;
        grid-column: 2;
        color: #9fb0bf;
      }
      #pause {
        position: fixed;
        top: 30%;
        left: 50%;
        transform: translateX(-50%);
        color: #f2f5f7;
        font: 600 30px/1 system-ui, sans-serif;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }
      #pause.review {
        top: 8%;
        font-size: 16px;
      }
      #panel label.check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 6px;
        cursor: pointer;
      }
      #panel label.check input {
        width: auto;
      }
      #panel .speeds {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      }
      #panel .speeds button {
        text-align: center;
      }
      #pause[hidden] {
        display: none;
      }
      #stats,
      #result,
      #contact {
        position: fixed;
        color: #f2f5f7;
        font: 15px/1.4 system-ui, sans-serif;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }
      #stats {
        top: 14px;
        left: 18px;
      }
      #result,
      #contact {
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
        font-weight: 600;
      }
      #result {
        top: 16%;
        font-size: 26px;
      }
      #result[data-kind='valid'] {
        color: #7be08a;
      }
      #result[data-kind='fault'] {
        color: #ff8a7a;
      }
      #result[data-kind='missed'] {
        color: #cfd6dc;
      }
      #contact {
        top: 58%;
        font-size: 17px;
      }
      #contact[data-kind='miss'] {
        color: #ffb38a;
      }
      #reach {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 14px;
        height: 14px;
        margin: -9px 0 0 -9px;
        border: 2px solid rgba(255, 255, 255, 0.45);
        border-radius: 50%;
        pointer-events: none;
        transition: transform 0.08s, border-color 0.08s;
      }
      #reach.on {
        border-color: #6dff8f;
        transform: scale(1.9);
      }
      #reach[hidden] {
        display: none;
      }
      #contact[data-kind='perfect'] {
        color: #ffd95a;
        font-size: 22px;
      }
      .flash {
        animation: flash 1.8s ease-out forwards;
      }
      #contact.flash {
        animation-duration: 0.9s;
      }
      @keyframes flash {
        0%,
        60% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      #start-prompt[hidden] {
        display: none;
      }
      #start-prompt strong {
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
