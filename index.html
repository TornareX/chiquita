<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Padel Trainer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
      }
      #start-prompt {
        position: fixed;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 14px 22px;
        border-radius: 10px;
        background: rgba(10, 16, 22, 0.78);
        color: #f2f5f7;
        font: 14px/1.4 system-ui, sans-serif;
        text-align: center;
        pointer-events: none;
      }
      #stats,
      #result,
      #contact {
        position: fixed;
        color: #f2f5f7;
        font: 15px/1.4 system-ui, sans-serif;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }
      #stats {
        top: 14px;
        left: 18px;
      }
      #result,
      #contact {
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
        font-weight: 600;
      }
      #result {
        top: 16%;
        font-size: 26px;
      }
      #result[data-kind='valid'] {
        color: #7be08a;
      }
      #result[data-kind='fault'] {
        color: #ff8a7a;
      }
      #result[data-kind='missed'] {
        color: #cfd6dc;
      }
      #contact {
        top: 58%;
        font-size: 17px;
      }
      #contact[data-kind='perfect'] {
        color: #ffd95a;
        font-size: 22px;
      }
      .flash {
        animation: flash 1.8s ease-out forwards;
      }
      #contact.flash {
        animation-duration: 0.9s;
      }
      @keyframes flash {
        0%,
        60% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      #start-prompt[hidden] {
        display: none;
      }
      #start-prompt strong {
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
